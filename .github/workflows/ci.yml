name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: 'pip' # <-- New: Tells GitHub to cache pip downloads

      - name: Install dependencies
        run: pip install -r requirements.txt # <-- New: Uses the shopping list

      - name: Run tests
        run: python -m pytest

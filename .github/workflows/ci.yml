name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env: # <-- New: Global environment variables
  PYTHONUNBUFFERED: "1"
  PROJECT_NAME: "Math Utils CI Learning"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Linter
        run: ruff check .
        # Note: If Ruff complains about Django boilerplate, we might need to configure it later !

      - name: Run Django system checks
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

      - name: Print Project Name
        run: echo "Running tests for $PROJECT_NAME" # <-- Using the global variable


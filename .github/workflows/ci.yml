name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env: # <-- New: Global environment variables
  PYTHONUNBUFFERED: "1"
  PROJECT_NAME: "Math Utils CI Learning"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # <-- New: Let all jobs finish
      matrix:
        python-version: ["3.10", "3.12"] # <-- Removed 3.9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Linter
        run: ruff check .

      - name: Print Project Name
        run: echo "Running tests for $PROJECT_NAME" # <-- Using the global variable

      - name: Run tests
        run: python -m pytest --junitxml=report.xml

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-report-${{ matrix.python-version }} # <-- Changed name
          path: report.xml
